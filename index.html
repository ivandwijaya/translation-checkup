<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POE translations — viewer</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3;
    --muted:#8b949e; --accent:#2f81f7; --key:#7ee787; --hover:#1f2630; --chip:#21262d;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#fff; --panel:#f6f8fa; --border:#d0d7de; --text:#1f2328;
      --muted:#636c76; --accent:#0969da; --key:#0a7d33; --hover:#eef1f4; --chip:#eaeef2; }
  }
  *{box-sizing:border-box}
  body{margin:0;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text)}
  header{padding:14px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:6}
  h1{margin:0 0 3px;font-size:17px}
  .sub{color:var(--muted);font-size:12px}
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:11px}
  input[type=search],select{padding:7px 11px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);font-size:13px}
  input[type=search]{flex:1;min-width:220px}
  select{cursor:pointer}
  .count{color:var(--muted);font-size:12px;white-space:nowrap}
  main{padding:0 18px 40px}
  .tablewrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:900px}
  th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--border);vertical-align:top;word-break:break-word}
  th{position:sticky;top:0;background:var(--panel);font-size:11px;text-transform:uppercase;letter-spacing:.03em;
    color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
  th:hover{color:var(--text)}
  th .arr{color:var(--accent);font-size:10px}
  col.c-key{width:22%} col.c-val{width:26%} col.c-ws{width:10%} col.c-bucket{width:18%} col.c-kn{width:16%} col.c-merged{width:8%}
  td.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
  td.key{color:var(--key)}
  td.val{white-space:pre-wrap}
  .badge{display:inline-block;padding:1px 7px;border-radius:10px;background:var(--chip);font-size:11px}
  .badge.t{color:#f0883e} .badge.f{color:var(--muted)}
  tr:hover td{background:var(--hover)}
  mark{background:rgba(47,129,247,.35);color:inherit;border-radius:2px}
  .idx{color:var(--muted);font-size:11px;width:50px}
  .pager{display:flex;gap:8px;align-items:center;justify-content:center;margin:16px 0;flex-wrap:wrap}
  .pager button{padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);cursor:pointer}
  .pager button:disabled{opacity:.4;cursor:default}
  .status{text-align:center;color:var(--muted);padding:40px}
  td.edit{cursor:text}
  td.edit:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--hover)}
  #download{padding:7px 11px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);cursor:pointer;font-size:13px}
  #download:hover{background:var(--hover)}
  #editnote{color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>POE translations</h1>
  <div class="sub">Android + iOS strings with assigned workspace / bucket / key.</div>
  <div class="controls">
    <input id="q" type="search" placeholder="Search key, value, bucket, key name…" autocomplete="off">
    <select id="matchmode" title="Exact = substring match. Loose = each space-separated word matched ignoring separators (booking trip → booking_trip).">
      <option value="exact">Exact match</option>
      <option value="loose">Loose match</option>
    </select>
    <select id="workspace"><option value="__all">All workspaces</option></select>
    <select id="merged">
      <option value="__all">All (merged?)</option>
      <option value="TRUE">Merged = TRUE</option>
      <option value="FALSE">Merged = FALSE</option>
      <option value="">Merged = (blank)</option>
    </select>
    <select id="pagesize">
      <option value="100">100 / page</option>
      <option value="250">250 / page</option>
      <option value="500">500 / page</option>
      <option value="1000">1000 / page</option>
      <option value="5000">5000 / page</option>
      <option value="all" selected>All rows</option>
    </select>
    <button id="download" hidden>⬇ Download CSV</button>
    <span class="count" id="editnote" hidden></span>
    <span class="count" id="count"></span>
  </div>
</header>
<main>
  <div id="status" class="status">Loading poe.csv…</div>
  <div class="tablewrap" hidden id="tw">
    <table id="table">
      <colgroup>
        <col style="width:50px"><col class="c-key"><col class="c-val"><col class="c-ws">
        <col class="c-bucket"><col class="c-kn"><col class="c-merged">
      </colgroup>
      <thead><tr id="head"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="pager" id="pager" hidden></div>
</main>
<script>
function parseCSV(text){
  const rows=[]; let row=[], field='', i=0, inq=false; const n=text.length;
  while(i<n){ const c=text[i];
    if(inq){ if(c==='"'){ if(text[i+1]==='"'){field+='"';i+=2;continue;} inq=false;i++;continue;} field+=c;i++;continue; }
    if(c==='"'){inq=true;i++;continue;}
    if(c===','){row.push(field);field='';i++;continue;}
    if(c==='\r'){i++;continue;}
    if(c==='\n'){row.push(field);rows.push(row);row=[];field='';i++;continue;}
    field+=c;i++;
  }
  if(field.length||row.length){row.push(field);rows.push(row);}
  return rows;
}
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function hlTerms(s,terms){ s=s||''; if(!terms||!terms.length) return esc(s);
  const re=new RegExp('('+terms.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','ig');
  let out='',last=0,m;
  while((m=re.exec(s))!==null){ out+=esc(s.slice(last,m.index))+'<mark>'+esc(m[0])+'</mark>'; last=m.index+m[0].length; if(m.index===re.lastIndex) re.lastIndex++; }
  return out+esc(s.slice(last)); }

const COLS=[
  {k:'key',   label:'Initial key',    field:0, cls:'mono key'},
  {k:'value', label:'Initial value',  field:1, cls:'val'},
  {k:'ws',    label:'Workspace',      field:2, cls:'mono'},
  {k:'bucket',label:'Assigned bucket',field:3, cls:'mono'},
  {k:'kn',    label:'Assigned key',   field:4, cls:'mono'},
  {k:'merged',label:'Merged',         field:5, cls:''},
];
let all=[], filtered=[], page=0, sortCol=null, sortDir=1;
const $=id=>document.getElementById(id);
// editing is enabled only when served locally (never on GitHub Pages)
const LOCAL=['localhost','127.0.0.1','[::1]',''].includes(location.hostname);
const EDITABLE=new Set([2,3,4]);   // assigned workspace / bucket / key name
let dirty=0, note='local edit mode';
function setNote(m){ if(m!==undefined) note=m; $('editnote').textContent=note; }

fetch('poe.csv').then(r=>{if(!r.ok)throw new Error(r.status);return r.text();}).then(txt=>{
  const rows=parseCSV(txt); rows.shift();
  all=rows.filter(r=>r.length>=6);
  all.forEach((r,i)=>r._i=i);
  if(LOCAL){ $('download').hidden=false; $('editnote').hidden=false; setNote(); $('download').onclick=downloadCSV; }
  // workspace dropdown
  const wsset=[...new Set(all.map(r=>r[2]))].sort((a,b)=>a.localeCompare(b));
  const sel=$('workspace');
  wsset.forEach(w=>{ const o=document.createElement('option'); o.value=w||'__blank'; o.textContent=w||'(blank)'; sel.appendChild(o); });
  // header
  $('head').innerHTML='<th class="idx">#</th>'+COLS.map((c,i)=>`<th data-i="${i}">${c.label} <span class="arr" id="arr${i}"></span></th>`).join('');
  COLS.forEach((c,i)=>$('head').children[i+1].onclick=()=>sortBy(i));
  $('status').hidden=true; $('tw').hidden=false; $('pager').hidden=false;
  apply();
}).catch(e=>{ $('status').textContent='Could not load poe.csv ('+e.message+'). Serve over http(s), not file://.'; });

function apply(){
  const q=$('q').value.trim().toLowerCase();
  const mode=$('matchmode').value;
  const terms = mode==='loose' ? q.split(/\s+/).filter(Boolean) : null;
  const wsv=$('workspace').value, mv=$('merged').value;
  filtered=all.filter(r=>{
    if(wsv!=='__all'){ const w=wsv==='__blank'?'':wsv; if(r[2]!==w) return false; }
    if(mv!=='__all' && r[5]!==mv) return false;
    if(!q) return true;
    const hay=(r[0]+' '+r[1]+' '+r[3]+' '+r[4]).toLowerCase();
    if(mode==='loose'){ const norm=hay.replace(/[^a-z0-9]+/g,' '); return terms.every(t=>norm.includes(t)); }
    return hay.includes(q);
  });
  if(sortCol!==null){
    const f=COLS[sortCol].field;
    filtered.sort((a,b)=>sortDir*(a[f]||'').localeCompare(b[f]||'',undefined,{sensitivity:'base',numeric:true}));
  }
  page=0; render();
}
function sortBy(i){ if(sortCol===i){ sortDir=-sortDir; } else { sortCol=i; sortDir=1; }
  COLS.forEach((c,j)=>$('arr'+j).textContent = j===sortCol ? (sortDir>0?'▲':'▼') : '');
  apply();
}
function render(){
  const raw=$('pagesize').value;
  const size = raw==='all' ? Math.max(filtered.length,1) : +raw;
  const pages=Math.max(1,Math.ceil(filtered.length/size));
  if(page>=pages)page=pages-1;
  const q=$('q').value.trim().toLowerCase(), start=page*size, slice=filtered.slice(start,start+size);
  const mode=$('matchmode').value;
  const hterms = !q ? [] : (mode==='loose' ? q.split(/\s+/).filter(Boolean) : [q]);
  $('tbody').innerHTML=slice.map((r,i)=>{
    const cells=COLS.map(c=>{
      const v=r[c.field];
      if(LOCAL && EDITABLE.has(c.field))
        return `<td class="${c.cls} edit" contenteditable="true" data-i="${r._i}" data-c="${c.field}">${esc(v)}</td>`;
      if(c.k==='merged'){ if(v==='TRUE')return '<td><span class="badge t">TRUE</span></td>';
        if(v==='FALSE')return '<td><span class="badge f">FALSE</span></td>'; return '<td></td>'; }
      const searchable=['key','value','bucket','kn'].includes(c.k);
      return `<td class="${c.cls}">${hlTerms(v, searchable?hterms:[])}</td>`;
    }).join('');
    return `<tr><td class="idx">${start+i+1}</td>${cells}</tr>`;
  }).join('');
  $('count').textContent=filtered.length.toLocaleString()+' / '+all.length.toLocaleString()+' rows';
  const P=$('pager'); P.innerHTML='';
  const mk=(t,pg,dis)=>{const b=document.createElement('button');b.textContent=t;b.disabled=dis;b.onclick=()=>{page=pg;render();window.scrollTo(0,0);};return b;};
  P.append(mk('« First',0,page===0), mk('‹ Prev',page-1,page===0));
  const info=document.createElement('span'); info.className='count'; info.textContent=`Page ${page+1} of ${pages}`; P.append(info);
  P.append(mk('Next ›',page+1,page>=pages-1), mk('Last »',pages-1,page>=pages-1));
}
let t;$('q').addEventListener('input',()=>{clearTimeout(t);t=setTimeout(apply,150);});
$('workspace').onchange=apply; $('merged').onchange=apply; $('matchmode').onchange=apply; $('pagesize').onchange=()=>{page=0;render();};

// --- local editing: persist edits into `all`, autosave to the local server ---
function csvCell(s){ s=(s==null?'':String(s)); return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function buildCSV(){
  const header=['initial key','initial value','assigned workspace','assigned bucket','assigned key name','is merged'];
  const lines=[header.map(csvCell).join(',')];
  for(const r of all) lines.push([r[0],r[1],(r[2]||'').trim(),(r[3]||'').trim(),(r[4]||'').trim(),r[5]].map(csvCell).join(','));
  return lines.join('\n')+'\n';
}
function downloadCSV(){
  const blob=new Blob([buildCSV()],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='poe.csv'; a.click(); URL.revokeObjectURL(a.href);
}
if(LOCAL){
  const tb=$('tbody'); let saveTimer=null;
  async function saveNow(){
    setNote('saving…');
    try{
      const res=await fetch('/save',{method:'POST',headers:{'Content-Type':'text/csv'},body:buildCSV()});
      if(!res.ok) throw new Error('HTTP '+res.status);
      dirty=0; setNote('✓ saved '+new Date().toLocaleTimeString());
    }catch(err){ setNote('⚠ autosave failed ('+err.message+') — use Download CSV'); }
  }
  const scheduleSave=()=>{ clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,600); };
  tb.addEventListener('input', e=>{
    const td=e.target.closest('td[contenteditable]'); if(!td) return;
    all[+td.dataset.i][+td.dataset.c]=td.textContent;
    dirty++; setNote('editing…'); scheduleSave();
  });
  tb.addEventListener('keydown', e=>{
    if(e.key==='Enter' && e.target.closest('td[contenteditable]')){ e.preventDefault(); e.target.blur(); }
  });
  window.addEventListener('beforeunload', e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });
}
</script>
</body>
</html>
