<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POE — workspace proposal</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#2f81f7;--key:#7ee787;--hover:#1f2630;--chip:#21262d;--warn:#f0883e}
  @media (prefers-color-scheme:light){:root{--bg:#fff;--panel:#f6f8fa;--border:#d0d7de;--text:#1f2328;--muted:#636c76;--accent:#0969da;--key:#0a7d33;--hover:#eef1f4;--chip:#eaeef2;--warn:#bc4c00}}
  *{box-sizing:border-box}
  body{margin:0;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
  header{padding:14px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:6}
  h1{margin:0 0 3px;font-size:17px}
  .sub{color:var(--muted);font-size:12px}
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:11px}
  input[type=search],select{padding:7px 11px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);font-size:13px}
  input[type=search]{flex:1;min-width:220px}
  .count{color:var(--muted);font-size:12px;white-space:nowrap}
  main{padding:0 18px 40px}
  .tablewrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:1120px}
  th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--border);vertical-align:top;word-break:break-word}
  th{position:sticky;top:0;background:var(--panel);font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
  th:hover{color:var(--text)} th .arr{color:var(--accent);font-size:10px}
  col.c-key{width:16%} col.c-val{width:17%} col.c-cur{width:8%} col.c-prop{width:9%} col.c-bucket{width:14%} col.c-kn{width:14%} col.c-merged{width:6%} col.c-conf{width:6%} col.c-why{width:10%}
  .badge.merged{color:#3fb950;font-weight:600} .badge.unmerged{opacity:.6}
  td.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
  td.key{color:var(--key)} td.val{white-space:pre-wrap}
  .arrow{color:var(--muted)} .prop{color:var(--accent);font-weight:600}
  .badge{display:inline-block;padding:1px 7px;border-radius:10px;background:var(--chip);font-size:11px}
  .badge.high{color:#3fb950} .badge.med{color:var(--warn)}
  tr:hover td{background:var(--hover)}
  mark{background:rgba(47,129,247,.35);border-radius:2px}
  .idx{color:var(--muted);font-size:11px;width:46px}
  .pager{display:flex;gap:8px;align-items:center;justify-content:center;margin:16px 0;flex-wrap:wrap}
  .pager button{padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);cursor:pointer}
  .pager button:disabled{opacity:.4;cursor:default}
  .status{text-align:center;color:var(--muted);padding:40px}
  a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>Workspace proposal <span class="sub">— proposed moves for currently-blank rows (review only, not applied)</span></h1>
  <div class="sub"><a href="/">← back to main viewer</a></div>
  <div class="controls">
    <input id="q" type="search" placeholder="Search key / value / reason…" autocomplete="off">
    <select id="prop"><option value="__all">All proposed workspaces</option></select>
    <select id="conf"><option value="__all">All confidence</option><option value="high">high</option><option value="med">med</option></select>
    <select id="mg"><option value="__all">All merged</option><option value="TRUE">TRUE</option><option value="FALSE">FALSE</option><option value="__blank">(blank)</option></select>
    <span class="count" id="count"></span>
  </div>
</header>
<main>
  <div id="status" class="status">Loading proposal.csv…</div>
  <div class="tablewrap" hidden id="tw">
    <table>
      <colgroup><col style="width:46px"><col class="c-key"><col class="c-val"><col class="c-cur"><col class="c-prop"><col class="c-bucket"><col class="c-kn"><col class="c-merged"><col class="c-conf"><col class="c-why"></colgroup>
      <thead><tr id="head"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="pager" id="pager" hidden></div>
</main>
<script>
function parseCSV(t){const rows=[];let row=[],f='',i=0,q=false;const n=t.length;
  while(i<n){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i+=2;continue;}q=false;i++;continue;}f+=c;i++;continue;}
    if(c==='"'){q=true;i++;continue;} if(c===','){row.push(f);f='';i++;continue;}
    if(c==='\r'){i++;continue;} if(c==='\n'){row.push(f);rows.push(row);row=[];f='';i++;continue;} f+=c;i++;}
  if(f.length||row.length){row.push(f);rows.push(row);} return rows;}
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function hl(s,q){s=s||'';if(!q)return esc(s);const i=s.toLowerCase().indexOf(q);if(i<0)return esc(s);
  return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length));}
// columns: 0 key,1 value,2 current,3 proposed,4 bucket,5 keyname,6 merged,7 confidence,8 reason
const COLS=[{l:'Initial key',f:0},{l:'Initial value',f:1},{l:'Current',f:2},{l:'→ Proposed ws',f:3},{l:'Proposed bucket',f:4},{l:'Proposed key',f:5},{l:'Merged',f:6},{l:'Conf',f:7},{l:'Reason',f:8}];
let all=[],filtered=[],page=0,sc=null,sd=1; const $=id=>document.getElementById(id);
fetch('proposal.csv').then(r=>{if(!r.ok)throw new Error(r.status);return r.text();}).then(txt=>{
  const rows=parseCSV(txt);rows.shift();all=rows.filter(r=>r.length>=9);all.forEach((r,i)=>r._i=i);
  const ws=[...new Set(all.map(r=>r[3]))].sort();const sel=$('prop');
  ws.forEach(w=>{const o=document.createElement('option');o.value=w;o.textContent=w;sel.appendChild(o);});
  $('head').innerHTML='<th class="idx">#</th>'+COLS.map((c,i)=>`<th data-i="${i}">${c.l} <span class="arr" id="a${i}"></span></th>`).join('');
  COLS.forEach((c,i)=>$('head').children[i+1].onclick=()=>sortBy(i));
  $('status').hidden=true;$('tw').hidden=false;$('pager').hidden=false;apply();
}).catch(e=>{$('status').textContent='Could not load proposal.csv ('+e.message+'). Serve via make serve.';});
function apply(){const q=$('q').value.trim().toLowerCase(),pw=$('prop').value,cf=$('conf').value,mg=$('mg').value;
  filtered=all.filter(r=>{if(pw!=='__all'&&r[3]!==pw)return false;if(cf!=='__all'&&r[7]!==cf)return false;
    if(mg==='__blank'){if((r[6]||'')!=='')return false;}else if(mg!=='__all'&&r[6]!==mg)return false;
    if(!q)return true;return (r[0]+' '+r[1]+' '+r[4]+' '+r[5]+' '+r[8]).toLowerCase().includes(q);});
  if(sc!==null){const f=COLS[sc].f;filtered.sort((a,b)=>sd*(a[f]||'').localeCompare(b[f]||'',undefined,{numeric:true}));}
  page=0;render();}
function sortBy(i){if(sc===i)sd=-sd;else{sc=i;sd=1;}COLS.forEach((c,j)=>$('a'+j).textContent=j===sc?(sd>0?'▲':'▼'):'');apply();}
function render(){const size=250,pages=Math.max(1,Math.ceil(filtered.length/size));if(page>=pages)page=pages-1;
  const q=$('q').value.trim().toLowerCase(),start=page*size,slice=filtered.slice(start,start+size);
  $('tbody').innerHTML=slice.map((r,i)=>{
    const conf=`<span class="badge ${r[7]}">${r[7]}</span>`;
    const mgv=r[6]||''; const mg=`<span class="badge ${mgv==='TRUE'?'merged':'unmerged'}">${mgv||'—'}</span>`;
    return `<tr><td class="idx">${start+i+1}</td>`+
      `<td class="mono key">${hl(r[0],q)}</td>`+
      `<td class="val">${hl(r[1],q)}</td>`+
      `<td class="mono"><span class="arrow">${esc(r[2])}</span></td>`+
      `<td class="mono prop">${esc(r[3])}</td>`+
      `<td class="mono">${hl(r[4],q)}</td>`+
      `<td class="mono">${hl(r[5],q)}</td>`+
      `<td>${mg}</td>`+
      `<td>${conf}</td>`+
      `<td>${hl(r[8],q)}</td></tr>`;}).join('');
  $('count').textContent=filtered.length.toLocaleString()+' / '+all.length.toLocaleString()+' proposed';
  const P=$('pager');P.innerHTML='';
  const mk=(t,pg,d)=>{const b=document.createElement('button');b.textContent=t;b.disabled=d;b.onclick=()=>{page=pg;render();scrollTo(0,0);};return b;};
  P.append(mk('« First',0,page===0),mk('‹ Prev',page-1,page===0));
  const s=document.createElement('span');s.className='count';s.textContent=`Page ${page+1} of ${pages}`;P.append(s);
  P.append(mk('Next ›',page+1,page>=pages-1),mk('Last »',pages-1,page>=pages-1));}
let t;$('q').addEventListener('input',()=>{clearTimeout(t);t=setTimeout(apply,150);});
$('prop').onchange=apply;$('conf').onchange=apply;$('mg').onchange=apply;
</script>
</body>
</html>
